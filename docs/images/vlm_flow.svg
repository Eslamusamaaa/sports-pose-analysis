<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 185' width='960' height='185' font-family='Segoe UI,Helvetica,Arial,sans-serif'><rect width='960' height='185' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' font-size='16' fill='#1f2328' text-anchor='start' font-weight='bold'>VLM labelling pipeline (karate_vlm/)</text><rect x='20' y='60' width='205' height='70' rx='8' fill='#fff7ed' stroke='#f97316' stroke-width='1.5'/><text x='122.5' y='100.0' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='bold'>windows.py</text><text x='122' y='108' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>Player 1/2 + 1.2 s windows,</text><text x='122' y='121' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>0.8 s stride</text><rect x='255' y='60' width='205' height='70' rx='8' fill='#fff7ed' stroke='#f97316' stroke-width='1.5'/><text x='357.5' y='100.0' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='bold'>make_grids.py</text><text x='357' y='108' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>2×4 numbered frame grid,</text><text x='357' y='121' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>blue / orange player boxes</text><line x1='225' y1='95' x2='255' y2='95' stroke='#57606a' stroke-width='1.6'/><polygon points='255,95 247,91 247,99' fill='#57606a'/><rect x='490' y='60' width='205' height='70' rx='8' fill='#fff7ed' stroke='#f97316' stroke-width='1.5'/><text x='592.5' y='100.0' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='bold'>run_vlm.py</text><text x='592' y='108' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>llama.cpp server,</text><text x='592' y='121' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>JSON-schema answer</text><line x1='460' y1='95' x2='490' y2='95' stroke='#57606a' stroke-width='1.6'/><polygon points='490,95 482,91 482,99' fill='#57606a'/><rect x='725' y='60' width='205' height='70' rx='8' fill='#fff7ed' stroke='#f97316' stroke-width='1.5'/><text x='827.5' y='100.0' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='bold'>report.py / compare.py</text><text x='827' y='108' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>HTML timelines +</text><text x='827' y='121' font-size='11' fill='#57606a' text-anchor='middle' font-weight='normal'>model comparison</text><line x1='695' y1='95' x2='725' y2='95' stroke='#57606a' stroke-width='1.6'/><polygon points='725,95 717,91 717,99' fill='#57606a'/><text x='20' y='165' font-size='12' fill='#57606a' text-anchor='start' font-weight='normal'>Answer fields: what_happened → attack → side → kick_type → height → label (12 WKF labels) → confidence</text></svg>