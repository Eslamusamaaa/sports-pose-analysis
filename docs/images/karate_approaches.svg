<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 428' width='860' height='428' font-family='Segoe UI,Helvetica,Arial,sans-serif'><rect width='860' height='428' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' font-size='16' fill='#1f2328' text-anchor='start' font-weight='bold'>Karate: every approach, and where it stands</text><rect x='20' y='50' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='67' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>A  Pose pipeline (OpenPose / RTMPose / YOLO)</text><text x='34' y='82' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>pose → track → players → windows</text><rect x='660' y='57' width='170' height='24' rx='12' fill='#16a34a'/><text x='745' y='74' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>BUILT</text><rect x='20' y='96' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='113' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>B  Object detection / person detection</text><text x='34' y='128' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>YOLO11 · RTMDet boxes, ByteTrack, referee filtering</text><rect x='660' y='103' width='170' height='24' rx='12' fill='#16a34a'/><text x='745' y='120' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>BUILT</text><rect x='20' y='142' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='159' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>C  Pretrained skeleton classifier (NTU60)</text><text x='34' y='174' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>ST-GCN + PoseC3D ensemble, out-of-domain</text><rect x='660' y='149' width='170' height='24' rx='12' fill='#ca8a04'/><text x='745' y='166' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>BUILT, weak</text><rect x='20' y='188' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='205' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>D  Vision-Language Model, zero-shot</text><text x='34' y='220' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>12 WKF labels, 3 VLMs compared</text><rect x='660' y='195' width='170' height='24' rx='12' fill='#ca8a04'/><text x='745' y='212' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>PROTOTYPE</text><rect x='20' y='234' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='251' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>E  Simulated / synthetic data</text><text x='34' y='266' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>SwimXYZ done · Kyokushin MoCap → 2D planned</text><rect x='660' y='241' width='170' height='24' rx='12' fill='#2563eb'/><text x='745' y='258' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>SWIM done, karate PLANNED</text><rect x='20' y='280' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='297' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>F  Data acquisition (public / gated sets)</text><text x='34' y='312' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>research done, requests not sent</text><rect x='660' y='287' width='170' height='24' rx='12' fill='#2563eb'/><text x='745' y='304' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>RESEARCHED</text><rect x='20' y='326' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='343' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>G  Own annotation + fine-tune</text><text x='34' y='358' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>VLM proposals → human review → ST-GCN</text><rect x='660' y='333' width='170' height='24' rx='12' fill='#dc2626'/><text x='745' y='350' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>NOT STARTED</text><rect x='20' y='372' width='820' height='38' rx='8' fill='#f6f8fa' stroke='#d0d7de'/><text x='34' y='389' font-size='13' fill='#1f2328' text-anchor='start' font-weight='bold'>H  Scoring-event model (yuko / waza-ari / ippon)</text><text x='34' y='404' font-size='11' fill='#57606a' text-anchor='start' font-weight='normal'>needs separate labels and model</text><rect x='660' y='379' width='170' height='24' rx='12' fill='#dc2626'/><text x='745' y='396' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='bold'>NOT STARTED</text></svg>